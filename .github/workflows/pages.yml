name: Deploy site to GitHub Pages

# Publishes the repository root as the site. `enablement: true` below switches
# GitHub Pages on by itself the first time this runs, so nobody has to flip it
# in Settings; GitHub authenticates the call with the workflow's own token.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write          # required for enablement and for deploying
  id-token: write       # required by deploy-pages

# Let a running deploy finish rather than cancelling it half-published
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .       # the site is the repository root

      - id: deployment
        uses: actions/deploy-pages@v4
